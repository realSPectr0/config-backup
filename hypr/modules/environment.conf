############################
### PROGRAMS & AUTOSTART ###
############################

$terminal = kitty
$fileManager = files
$menu = ~/.config/waybar/Scripts/launch.sh
$rofi = ~/rofi/files/launchers/type-6/launcher.sh
$qylock = /home/arch/.local/share/quickshell-lockscreen/lock.sh
$anicli = /home/arch/.local/bin/ani-cli --rofi

# exec-once = waybar
exec-once = fcitx5 &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP DESKTOP_SESSION HYPRLAND_INSTANCE_SIGNATURE
exec-once = nm-applet &
exec-once = blueman-applet &
exec-once = awww-daemon
exec-once = wal -R
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = python3 /home/arch/startpage/z.startpage/scripts/media-bridge.py
exec-once = python3 /home/arch/startpage/z.startpage/scripts/stats-bridge.py
exec-once = quickshell -p ~/.config/quickshell/startpage/shell.qml
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = ~/.config/waybar/Scripts/waybar-theme.sh --restore


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_IM_MODULE, fcitx
env = XMODIFIERS, @im=fcitx
env = SDL_IM_MODULE, fcitx
env = GLFW_IM_MODULE, ibus
# Prefer the NVIDIA dGPU for compositing and keep Intel available for its outputs.
# Local symlinks avoid the ':' characters in PCI by-path names, which AQ uses as separators.
env = AQ_DRM_DEVICES,/home/arch/.config/hypr/nvidia-card:/home/arch/.config/hypr/intel-card
