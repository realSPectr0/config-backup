################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Layout, left to right: laptop panel, LG UltraGear, ASUS.
# Externals are matched by desc: (make/model/serial), NOT connector name --
# DP-N numbers change across replugs (DP-5/DP-6 became DP-2/DP-3).
# Positions are LOGICAL pixels, so eDP-1 occupies 1920/1.25 = 1536 and the
# externals start at 1536 and 3456 to sit flush with no dead gap.
#
# eDP-1 and the ASUS run at their panels' real top rate.
monitor = eDP-1, 1920x1200@165.01, 0x0, 1.25
monitor = desc:ASUSTek COMPUTER INC VZ249QG1R MCLMDW008292, 1920x1080@74.97, 3456x0, 1

# LG UltraGear is CAPPED AT 60 ON PURPOSE -- do not raise it.
# The panel does 200 Hz, but only over DisplayPort: that mode needs a
# 467.33 MHz pixel clock and this link is a DP->HDMI adapter whose EDID
# declares "Maximum TMDS clock: 300 MHz". Setting 200 Hz succeeds as a
# modeset and then the monitor loses sync and goes BLACK.
# Tell-tale: its best 4K mode is only 3840x2160@30 (297 MHz).
# To actually get 200 Hz, connect it over real DisplayPort (USB-C DP alt
# mode or a DP cable) and change this to 1920x1080@200.07.
monitor = desc:LG Electronics LG ULTRAGEAR 607NTBKPA965, 1920x1080@60, 1536x0, 1

# Fall back for unknown outputs. Deliberately NOT applied to the LG: highrr
# would pick that same unreachable 200 Hz mode and black the screen again.
monitor = , highrr, auto, 1

# Primary workspace at login. The LG is the centre screen and the main monitor.
workspace = 1, monitor:desc:LG Electronics LG ULTRAGEAR 607NTBKPA965, default:true

xwayland {
  force_zero_scaling = true
}
