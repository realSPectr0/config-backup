################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Use the external ASUS monitor as the main display at the layout origin, with
# the laptop panel to its left. eDP-2 covers systems where the internal panel
# uses that name.
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, preferred, -1600x0, 1.2
monitor = eDP-2, preferred, -1536x0, 1.25

# Keep the primary workspace on the external display after reload/login.
workspace = 1, monitor:HDMI-A-1, default:true

xwayland {
  force_zero_scaling = true
}
