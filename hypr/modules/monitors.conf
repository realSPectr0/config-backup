################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# Use the external ASUS monitor's native 1080p mode as the desktop source.
# Mirror that desktop to either possible internal-panel connector name.
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = eDP-1, preferred, 0x0, 1, mirror, HDMI-A-1
monitor = eDP-2, preferred, 0x0, 1, mirror, HDMI-A-1

xwayland {
  force_zero_scaling = true
}
