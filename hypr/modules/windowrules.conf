##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/


# Ignore maximize requests
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Fix XWayland drag issues
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# hyprland-run popup
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# iwdgui floating window
windowrule {
    name = iwdgui-float
    match:class = .*[Ii]wdgui.*

    float = yes
    center = yes
    size = 720 520
}

# Pavucontrol floating window
windowrule {
    name = pavucontrol-float
    match:class = .*[Pp]avucontrol.*

    float = yes
    center = yes
    size = 900 600
}

# PHNexus quickshell settings center (~/.local/bin/settings)
windowrule {
    name = quickshell-settings
    match:class = ^org\.quickshell$
    match:title = ^Settings$

    float = yes
    center = yes
    size = 1200 700
}

# PHNexus swaync layer rules (from their window_rules.lua)
layerrule {
    name = swaync-notification-window
    match:namespace = swaync-notification-window
    animation = slide right
    blur = on
    ignore_alpha = 0.5
}

layerrule {
    name = swaync-control-center
    match:namespace = ^swaync-control-center$
    animation = slide right
    blur = on
    ignore_alpha = 0.5
}

# PHNexus wofi launcher (from their window_rules.lua)
layerrule {
    name = wofi-launcher
    match:namespace = ^wofi$
    animation = popin 60%
    blur = on
    ignore_alpha = 0.5
}

# Rofi gets the same blur/pop-in as the PHNexus wofi launcher
layerrule {
    name = rofi-launcher
    match:namespace = ^rofi$
    animation = popin 60%
    blur = on
    ignore_alpha = 0.5
}
